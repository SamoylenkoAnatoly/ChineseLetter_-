<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>众人 — ввод по чертам</title>
  <link rel="stylesheet" href="hanzi-common.css">
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script src="hanzi-embed.js"></script>
</head>
<body>
  <main>
    <h1>Китайское слово</h1>
    <div class="hanzi" aria-hidden="true">众人</div>
    <p class="meta">zhòngrén · все, толпа</p>
    <p class="hint">Нарисуйте 众人 по чертам: каждый иероглиф по очереди</p>
    <div class="word-grid">
      <div class="writer-wrap"><div id="target-0" aria-label="Поле для написания иероглифа 众"></div></div>
      <div class="writer-wrap"><div id="target-1" aria-label="Поле для написания иероглифа 人"></div></div>
    </div>
    <p id="progress" class="progress">Иероглиф 1 из 2 · черта 0 из 0</p>
    <p id="status" class="status" role="status">Обведите контур, начиная с первой черты</p>
    <div class="actions">
      <button type="button" id="animate-btn">Показать черты</button>
      <button type="button" class="primary" id="retry-btn">Заново</button>
    </div>
  </main>
  <script>window.HANZI = {"chars": ["众", "人"], "pinyin": "zhòngrén", "meaning": "все, толпа"};</script>
  <script src="hanzi-word-practice.js"></script>
</body>
</html>

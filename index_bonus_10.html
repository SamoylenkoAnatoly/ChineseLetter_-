<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16344a">
  <title>Рыбалка иероглифов</title>
  <style>
    :root {
      --ink: #16344a;
      --night: #102636;
      --panel: #f4ecd0;
      --paper: #fff8e4;
      --cream: #d8c48a;
      --water: #3c8ea8;
      --water-dark: #2a6d86;
      --teal: #2f7d74;
      --gold: #e0b14a;
      --muted: #6d6a58;
      --red: #c45c4a;
      --shadow: 5px 5px 0 var(--ink);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 280px;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(10px, 2vw, 20px);
      color: var(--ink);
      background:
        linear-gradient(rgba(255, 255, 255, 0.04) 50%, transparent 50%) 0 0 / 100% 4px,
        radial-gradient(circle at 50% -18%, #2d5c72 0, var(--night) 62%);
      font-family: "Courier New", "MS Gothic", monospace;
      image-rendering: pixelated;
    }

    button {
      font: inherit;
    }

    .game-shell {
      width: min(100%, 700px);
      border: 3px solid var(--cream);
      outline: 4px solid var(--ink);
      background: var(--panel);
      box-shadow: 9px 9px 0 rgba(0, 0, 0, 0.38);
      overflow: hidden;
    }

    .top-stripe {
      height: 8px;
      background: repeating-linear-gradient(90deg, var(--water) 0 18px, var(--gold) 18px 36px);
      border-bottom: 3px solid var(--ink);
    }

    .screen {
      min-height: min(520px, calc(100svh - 40px));
      padding: clamp(16px, 4vw, 30px);
    }

    .screen[hidden] {
      display: none;
    }

    .start-screen,
    .level-screen,
    .victory-screen {
      display: grid;
      place-items: center;
      align-content: center;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--water-dark);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1,
    h2,
    p {
      margin-top: 0;
    }

    h1 {
      max-width: 560px;
      margin-bottom: 10px;
      font-size: clamp(1.55rem, 5vw, 2.65rem);
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 var(--gold);
    }

    .start-copy {
      max-width: 480px;
      margin-bottom: 22px;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.45;
    }

    .character-preview {
      margin: 2px 0 22px;
      color: var(--water-dark);
      font-family: "MS Gothic", "Noto Sans CJK SC", sans-serif;
      font-size: clamp(1.15rem, 4vw, 1.7rem);
      letter-spacing: 0.2em;
    }

    .mode-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 13px;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      width: min(100%, 560px);
      margin-top: 12px;
    }

    .level-card {
      min-height: 104px;
      padding: 14px;
      border: 3px solid var(--ink);
      color: var(--ink);
      background: var(--paper);
      box-shadow: 4px 4px 0 var(--ink);
      cursor: pointer;
      font: inherit;
      text-align: left;
      transition: transform 80ms ease, box-shadow 80ms ease, background 120ms ease;
    }

    .level-card:hover {
      background: var(--cream);
    }

    .level-card:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .level-card strong,
    .level-card span {
      display: block;
    }

    .level-card strong {
      margin-bottom: 7px;
      color: var(--water-dark);
      font-size: 0.9rem;
      text-transform: uppercase;
    }

    .level-card span {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.35;
    }

    .pixel-button {
      min-height: 44px;
      padding: 11px 20px;
      border: 3px solid var(--ink);
      border-radius: 0;
      color: #fff;
      background: var(--water);
      box-shadow: var(--shadow);
      cursor: pointer;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: transform 80ms ease, box-shadow 80ms ease, background 120ms ease;
    }

    .pixel-button:hover {
      background: #4aa3bd;
    }

    .pixel-button:active {
      transform: translate(4px, 4px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .pixel-button:focus-visible {
      outline: 3px dashed var(--water-dark);
      outline-offset: 5px;
    }

    .pixel-button.secondary {
      min-height: 34px;
      padding: 7px 11px;
      color: var(--ink);
      background: var(--cream);
      box-shadow: 3px 3px 0 var(--ink);
      font-size: 0.72rem;
    }

    .battle-screen {
      padding: clamp(12px, 2.7vw, 22px);
    }

    .battle-header {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }

    .round-count {
      font-size: 0.78rem;
      font-weight: 900;
      white-space: nowrap;
    }

    .progress-track,
    .catch-track {
      height: 14px;
      border: 2px solid var(--ink);
      background: #fff;
      overflow: hidden;
    }

    .progress-fill,
    .catch-fill {
      width: 0;
      height: 100%;
      background: repeating-linear-gradient(90deg, var(--teal) 0 12px, #4aa08f 12px 16px);
      transition: width 350ms steps(5, end);
    }

    .battle-grid {
      display: grid;
      grid-template-columns: minmax(185px, 0.95fr) minmax(225px, 1.05fr);
      gap: clamp(14px, 3vw, 26px);
      align-items: center;
    }

    .pond-zone {
      display: grid;
      place-items: center;
      align-content: center;
      min-height: 290px;
      padding: 12px;
      border: 3px solid var(--ink);
      background:
        linear-gradient(transparent 58%, var(--water) 58% 63%, var(--water-dark) 63%),
        repeating-linear-gradient(0deg, #cfe7ee 0 3px, #d7edf2 3px 6px);
      overflow: hidden;
    }

    .pond-wrap {
      display: grid;
      justify-items: center;
      width: 100%;
      position: relative;
    }

    .rod {
      position: absolute;
      top: 6px;
      right: 18px;
      width: 70px;
      height: 92px;
      pointer-events: none;
    }

    .pond-wrap.catching .rod {
      animation: rod-tug 420ms steps(3, end);
    }

    .fish {
      width: clamp(105px, 22vw, 145px);
      filter: drop-shadow(5px 6px 0 rgba(22, 52, 74, 0.28));
      transform: translateY(42px) scale(0.7);
      opacity: 0.35;
    }

    .fish.catching {
      animation: fish-jump 650ms steps(5, end) forwards;
    }

    .fish.landed {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .splash {
      width: 92px;
      height: 18px;
      margin-top: -8px;
      background:
        repeating-linear-gradient(90deg, transparent 0 8px, #fff 8px 12px),
        var(--water);
      opacity: 0;
    }

    .pond-wrap.catching .splash {
      animation: splash 650ms steps(4, end);
    }

    .fish-name {
      margin: 10px 0 5px;
      font-size: 0.78rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    .catch-wrap {
      width: min(100%, 180px);
    }

    .catch-track {
      height: 12px;
    }

    .task-zone {
      display: grid;
      justify-items: center;
      min-width: 0;
    }

    .task-title {
      margin-bottom: 8px;
      font-size: clamp(0.82rem, 2.5vw, 1rem);
      text-align: center;
    }

    .writer-frame {
      position: relative;
      width: min(100%, 255px);
      aspect-ratio: 1;
      border: 3px solid var(--ink);
      background:
        linear-gradient(45deg, transparent calc(50% - 1px), rgba(42, 109, 134, 0.16) 50%, transparent calc(50% + 1px)),
        linear-gradient(-45deg, transparent calc(50% - 1px), rgba(42, 109, 134, 0.16) 50%, transparent calc(50% + 1px)),
        linear-gradient(90deg, transparent calc(50% - 1px), rgba(42, 109, 134, 0.16) 50%, transparent calc(50% + 1px)),
        linear-gradient(transparent calc(50% - 1px), rgba(42, 109, 134, 0.16) 50%, transparent calc(50% + 1px)),
        var(--paper);
      box-shadow: 5px 5px 0 var(--ink);
      touch-action: none;
    }

    .writer-frame[hidden],
    .choice-panel[hidden] {
      display: none;
    }

    .choice-panel {
      display: grid;
      gap: 10px;
      width: min(100%, 270px);
      margin: 8px 0;
    }

    .choice-button {
      min-height: 46px;
      padding: 9px 12px;
      border: 2px solid var(--ink);
      color: var(--ink);
      background: var(--paper);
      box-shadow: 3px 3px 0 var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 0.78rem;
      font-weight: 800;
      transition: transform 80ms ease, background 120ms ease;
    }

    .choice-button:hover {
      background: var(--cream);
    }

    .choice-button:active {
      transform: translate(2px, 2px);
    }

    .choice-button.wrong {
      color: #fff;
      background: var(--red);
    }

    .choice-button.correct {
      color: #fff;
      background: var(--teal);
    }

    .task-zone.matching .task-title {
      display: grid;
      gap: 7px;
    }

    .task-zone.matching #current-character {
      color: var(--water-dark);
      font-family: "MS Gothic", "Noto Sans CJK SC", sans-serif;
      font-size: clamp(2.7rem, 10vw, 4.4rem);
      line-height: 1;
    }

    #writer-target,
    #writer-target svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .loading-note {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      color: var(--muted);
      background: rgba(255, 248, 228, 0.92);
      font-size: 0.76rem;
      font-weight: 700;
      text-align: center;
    }

    .loading-note[hidden] {
      display: none;
    }

    .task-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: min(100%, 260px);
      margin-top: 13px;
    }

    .feedback {
      min-height: 2.4em;
      margin: 0;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .feedback.bad {
      color: var(--red);
    }

    .feedback.good {
      color: var(--teal);
    }

    .victory-glyph {
      margin-bottom: 10px;
      color: var(--gold);
      font-size: clamp(3.4rem, 12vw, 5.5rem);
      line-height: 1;
      text-shadow: 4px 4px 0 var(--water-dark);
    }

    .victory-screen h2 {
      margin-bottom: 8px;
      font-size: clamp(1.55rem, 5vw, 2.3rem);
      text-transform: uppercase;
    }

    .victory-stats {
      margin-bottom: 10px;
      color: var(--muted);
      font-weight: 700;
    }

    .victory-code {
      margin: 0 0 22px;
      color: var(--water-dark);
      font-size: clamp(2rem, 8vw, 3.2rem);
      font-weight: 900;
      letter-spacing: 0.22em;
      text-shadow: 3px 3px 0 var(--gold);
    }

    @keyframes rod-tug {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(-12deg); }
      70% { transform: rotate(8deg); }
    }

    @keyframes fish-jump {
      0% { transform: translateY(42px) scale(0.7); opacity: 0.35; }
      35% { transform: translateY(-18px) scale(1.05); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes splash {
      0%, 100% { opacity: 0; transform: scaleX(0.4); }
      40% { opacity: 1; transform: scaleX(1.2); }
    }

    @media (max-width: 520px) {
      body {
        place-items: start center;
        padding: 8px;
      }

      .screen {
        min-height: calc(100svh - 24px);
      }

      .battle-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .pond-zone {
        grid-row: 2;
        min-height: 128px;
      }

      .fish {
        width: 74px;
      }

      .fish-name {
        margin-top: 3px;
      }

      .writer-frame {
        width: min(68vw, 230px);
      }

      .battle-header {
        margin-bottom: 10px;
      }

      .level-grid {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .level-card {
        min-height: 78px;
      }
    }

    @media (max-height: 580px) and (min-width: 521px) {
      .screen {
        min-height: 0;
      }

      .pond-zone {
        min-height: 245px;
      }

      .writer-frame {
        width: min(42vh, 225px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-live="polite">
    <div class="top-stripe" aria-hidden="true"></div>

    <section class="screen start-screen" id="start-screen">
      <div>
        <p class="eyebrow">Ретро-тренировка</p>
        <h1>Рыбалка иероглифов</h1>
        <p class="start-copy">Напишите 9 знаков и выловите девять рыб у пирса.</p>
        <div class="character-preview" aria-label="Иероглифы в игре">术 中 右 心 必 想 白 勺 的</div>
        <div class="mode-actions">
          <button class="pixel-button" id="start-button" type="button">Начать</button>
        </div>
      </div>
    </section>

    <section class="screen level-screen" id="level-screen" hidden>
      <div>
        <p class="eyebrow">Выбор испытания</p>
        <h2>Выберите уровень</h2>
        <div class="level-grid">
          <button class="level-card" type="button" data-level="1">
            <strong>Уровень 1</strong>
            <span>Напишите иероглиф по видимому контуру.</span>
          </button>
          <button class="level-card" type="button" data-level="2">
            <strong>Уровень 2</strong>
            <span>Вспомните и напишите иероглиф по переводу.</span>
          </button>
          <button class="level-card" type="button" data-level="3">
            <strong>Уровень 3</strong>
            <span>Сопоставьте иероглиф с его значением.</span>
          </button>
          <button class="level-card" type="button" data-level="4">
            <strong>Уровень 4</strong>
            <span>Сопоставьте иероглиф с его произношением.</span>
          </button>
        </div>
      </div>
    </section>

    <section class="screen battle-screen" id="battle-screen" hidden>
      <header class="battle-header">
        <span class="round-count" id="round-count">0 / 9</span>
        <div class="progress-track" role="progressbar" aria-label="Прогресс игры" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0" id="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="round-count">Лови!</span>
      </header>

      <div class="battle-grid">
        <section class="pond-zone" aria-label="Улов">
          <div class="pond-wrap" id="pond-wrap">
            <svg class="rod" viewBox="0 0 70 92" aria-hidden="true">
              <path fill="#8a5a32" d="M52 4h8v62h-8z"/>
              <path fill="#16344a" d="M18 66h42v6H18z"/>
              <path fill="#e0b14a" d="M56 4h4v8h-4z"/>
            </svg>
            <svg class="fish" id="fish" viewBox="0 0 160 90" role="img" aria-label="Рыба"></svg>
            <div class="splash" aria-hidden="true"></div>
            <div>
              <p class="fish-name" id="fish-name">Ждём клёв…</p>
              <div class="catch-wrap">
                <div class="catch-track" role="progressbar" aria-label="Улов" aria-valuemin="0" aria-valuemax="9" aria-valuenow="0" id="catch-track">
                  <div class="catch-fill" id="catch-fill"></div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="task-zone" id="task-zone" aria-label="Задание">
          <h2 class="task-title"><span id="task-label">Напишите:</span> <span id="current-character">—</span></h2>
          <div class="writer-frame" id="writer-frame">
            <div id="writer-target" aria-label="Поле для написания иероглифа"></div>
            <div class="loading-note" id="loading-note">Загрузка знака…</div>
          </div>
          <div class="choice-panel" id="choice-panel" hidden></div>
          <div class="task-footer" id="task-footer">
            <p class="feedback" id="feedback">Следуйте контуру и порядку черт.</p>
            <button class="pixel-button secondary" id="retry-button" type="button">Сбросить</button>
          </div>
        </section>
      </div>
    </section>

    <section class="screen victory-screen" id="victory-screen" hidden>
      <div>
        <div class="victory-glyph" aria-hidden="true">鱼</div>
        <p class="eyebrow">Улов полный</p>
        <h2>Победа!</h2>
        <p class="victory-stats" id="victory-stats">Все 9 рыб пойманы.</p>
        <p class="victory-code" id="victory-code" aria-label="Код победы"></p>
        <button class="pixel-button" id="restart-button" type="button">Выбрать уровень</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7.3/dist/hanzi-writer.min.js"></script>
  <script>
    (() => {

        {
          name: "Лосось",
          svg: `<path fill="#c45c4a" d="M16 40h18v-8h50v8h24v10h18v12h-18v10H84v8H34v-8H16V52H8V40h8z"/><path fill="#f4ecd0" d="M40 44h36v8H40z"/><path fill="#16344a" d="M92 44h10v10H92z"/><path fill="#e0b14a" d="M126 50h16v10h-16z"/>`
        },
        {
          name: "Рыба-меч",
          svg: `<path fill="#6d6a58" d="M6 48h28v8H6z"/><path fill="#3c8ea8" d="M34 36h54v8h22v8h16v12h-16v8H88v8H34v-8H22V44h12z"/><path fill="#16344a" d="M96 44h10v10H96z"/><path fill="#f4ecd0" d="M48 44h20v8H48z"/><path fill="#e0b14a" d="M70 28h10v8H70z"/>`
        }
      ];
      const screens = {
        start: document.getElementById("start-screen"),
        levels: document.getElementById("level-screen"),
        battle: document.getElementById("battle-screen"),
        victory: document.getElementById("victory-screen")
      };
      const elements = {
        startButton: document.getElementById("start-button"),
        levelButtons: document.querySelectorAll("[data-level]"),
        restartButton: document.getElementById("restart-button"),
        retryButton: document.getElementById("retry-button"),
        target: document.getElementById("writer-target"),
        writerFrame: document.getElementById("writer-frame"),
        choicePanel: document.getElementById("choice-panel"),
        taskZone: document.getElementById("task-zone"),
        taskLabel: document.getElementById("task-label"),
        currentCharacter: document.getElementById("current-character"),
        roundCount: document.getElementById("round-count"),
        progressTrack: document.getElementById("progress-track"),
        progressFill: document.getElementById("progress-fill"),
        catchTrack: document.getElementById("catch-track"),
        catchFill: document.getElementById("catch-fill"),
        pondWrap: document.getElementById("pond-wrap"),
        fish: document.getElementById("fish"),
        fishName: document.getElementById("fish-name"),
        feedback: document.getElementById("feedback"),
        loadingNote: document.getElementById("loading-note"),
        victoryStats: document.getElementById("victory-stats"),
        victoryCode: document.getElementById("victory-code")
      };

      let sequence = [];
      let fishOrder = [];
      let currentIndex = 0;
      let totalMistakes = 0;
      let currentMistakes = 0;
      let writer = null;
      let roundToken = 0;
      let roundLocked = false;
      let currentLevel = 1;

      function shuffle(items) {
        const shuffled = [...items];
        for (let i = shuffled.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
      }

      function showScreen(name) {
        Object.entries(screens).forEach(([key, screen]) => {
          screen.hidden = key !== name;
        });
      }

      function setFeedback(message, tone = "") {
        elements.feedback.textContent = message;
        elements.feedback.className = `feedback ${tone}`.trim();
      }

      function updateMeters() {
        const completed = currentIndex;
        const completedPercent = (completed / CHARACTERS.length) * 100;

        elements.roundCount.textContent = `${completed} / ${CHARACTERS.length}`;
        elements.progressFill.style.width = `${completedPercent}%`;
        elements.progressTrack.setAttribute("aria-valuenow", String(completed));
        elements.catchFill.style.width = `${completedPercent}%`;
        elements.catchTrack.setAttribute("aria-valuenow", String(completed));
      }

      function clearWriter() {
        roundToken += 1;
        if (writer && typeof writer.cancelQuiz === "function") {
          writer.cancelQuiz();
        }
        writer = null;
        elements.target.replaceChildren();
      }

      function failCharacterLoad(token) {
        if (token !== roundToken) return;
        elements.loadingNote.hidden = false;
        elements.loadingNote.textContent = "Не удалось загрузить знак. Проверьте интернет и нажмите «Сбросить».";
        elements.retryButton.textContent = "Повторить";
        setFeedback("Данные Hanzi Writer недоступны.", "bad");
      }

      function showWaitingFish() {
        elements.fish.innerHTML = "";
        elements.fish.classList.remove("catching", "landed");
        elements.fishName.textContent = "Ждём клёв…";
        elements.pondWrap.classList.remove("catching");
      }

      function catchFish() {
        const fish = fishOrder[currentIndex] || FISH[currentIndex];
        elements.fish.innerHTML = fish.svg;
        elements.fish.setAttribute("aria-label", fish.name);
        elements.fishName.textContent = fish.name;
        elements.fish.classList.remove("catching", "landed");
        elements.pondWrap.classList.remove("catching");
        void elements.fish.offsetWidth;
        elements.pondWrap.classList.add("catching");
        elements.fish.classList.add("catching");
      }

      function loadCurrentChallenge() {
        clearWriter();
        roundLocked = false;
        currentMistakes = 0;
        elements.retryButton.textContent = "Сбросить";
        elements.retryButton.hidden = currentLevel >= 3;
        elements.writerFrame.hidden = currentLevel >= 3;
        elements.choicePanel.hidden = currentLevel < 3;
        elements.taskZone.classList.toggle("matching", currentLevel >= 3);
        showWaitingFish();

        const task = sequence[currentIndex];
        const character = task.char;

        if (currentLevel >= 3) {
          elements.loadingNote.hidden = true;
          elements.taskLabel.textContent = currentLevel === 3 ? "Выберите значение:" : "Выберите произношение:";
          elements.currentCharacter.textContent = character;
          setFeedback("Выберите один правильный вариант.");
          loadMatchingOptions(task, roundToken);
          return;
        }

        elements.choicePanel.replaceChildren();
        elements.loadingNote.hidden = false;
        elements.loadingNote.textContent = "Загрузка знака…";
        elements.taskLabel.textContent = currentLevel === 2 ? "Перевод:" : "Напишите:";
        elements.currentCharacter.textContent = currentLevel === 2 ? task.translation : character;
        setFeedback(currentLevel === 2 ? "Вспомните знак и соблюдайте порядок черт." : "Следуйте контуру и порядку черт.");

        if (typeof window.HanziWriter === "undefined") {
          failCharacterLoad(roundToken);
          return;
        }

        const token = roundToken;
        const frameSize = Math.max(160, Math.round(elements.target.getBoundingClientRect().width));

        try {
          writer = window.HanziWriter.create(elements.target, character, {
            width: frameSize,
            height: frameSize,
            padding: Math.round(frameSize * 0.08),
            showCharacter: false,
            showOutline: currentLevel === 1,
            outlineColor: "#c9dbe3",
            strokeColor: "#2a6d86",
            drawingColor: "#16344a",
            highlightColor: "#e0b14a",
            drawingWidth: Math.max(5, Math.round(frameSize * 0.025)),
            strokeWidth: 2,
            leniency: 1.15,
            showHintAfterMisses: 3,
            highlightOnComplete: true,
            acceptBackwardsStrokes: false,
            onLoadCharDataSuccess: () => {
              if (token === roundToken) {
                elements.loadingNote.hidden = true;
              }
            },
            onLoadCharDataError: () => failCharacterLoad(token)
          });

          writer.quiz({
            onMistake: () => {
              if (token !== roundToken || roundLocked) return;
              currentMistakes += 1;
              totalMistakes += 1;
              setFeedback(currentMistakes >= 3 ? "Подсказка подсветит верную черту." : "Не та черта — попробуйте ещё.", "bad");
            },
            onCorrectStroke: (data) => {
              if (token !== roundToken || roundLocked) return;
              setFeedback(`Верно! Черта ${data.strokeNum + 1}.`, "good");
            },
            onComplete: () => completeCharacter(token, "Клюёт! Рыба на крючке.")
          });
        } catch (error) {
          failCharacterLoad(token);
        }
      }

      function loadMatchingOptions(task, token) {
        const key = currentLevel === 3 ? "translation" : "pronunciation";
        const distractors = shuffle(
          CHARACTERS.filter((candidate) => candidate.char !== task.char && candidate[key] !== task[key])
        ).slice(0, 3);
        const options = shuffle([task, ...distractors]);
        elements.choicePanel.replaceChildren();

        options.forEach((option) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "choice-button";
          button.textContent = option[key];
          button.addEventListener("click", () => {
            if (token !== roundToken || roundLocked) return;
            if (option.char === task.char) {
              button.classList.add("correct");
              elements.choicePanel.querySelectorAll("button").forEach((item) => {
                item.disabled = true;
              });
              completeCharacter(token, "Верно! Рыба поймана.");
            } else {
              button.classList.add("wrong");
              button.disabled = true;
              currentMistakes += 1;
              totalMistakes += 1;
              setFeedback("Неверно — выберите другой вариант.", "bad");
            }
          });
          elements.choicePanel.append(button);
        });
      }

      function completeCharacter(token, message) {
        if (token !== roundToken || roundLocked) return;
        roundLocked = true;
        setFeedback(message, "good");
        catchFish();

        currentIndex += 1;
        updateMeters();

        window.setTimeout(() => {
          if (currentIndex >= CHARACTERS.length) {
            finishGame();
          } else {
            loadCurrentChallenge();
          }
        }, 750);
      }

      function startGame(level) {
        currentLevel = level;
        sequence = shuffle(CHARACTERS);
        fishOrder = shuffle(FISH);
        currentIndex = 0;
        totalMistakes = 0;
        currentMistakes = 0;
        roundLocked = false;
        showWaitingFish();
        showScreen("battle");
        updateMeters();
        window.requestAnimationFrame(loadCurrentChallenge);
      }

      function finishGame() {
        clearWriter();
        elements.victoryStats.textContent = `Уровень ${currentLevel} пройден. Ошибок: ${totalMistakes}.`;
        elements.victoryCode.textContent = LEVEL_CODES[currentLevel];
        window.setTimeout(() => showScreen("victory"), 500);
      }

      elements.startButton.addEventListener("click", () => showScreen("levels"));
      elements.levelButtons.forEach((button) => {
        button.addEventListener("click", () => startGame(Number(button.dataset.level)));
      });
      elements.restartButton.addEventListener("click", () => showScreen("levels"));
      elements.retryButton.addEventListener("click", () => {
        if (!roundLocked && sequence.length) loadCurrentChallenge();
      });
    })();
  </script>
</body>
</html>

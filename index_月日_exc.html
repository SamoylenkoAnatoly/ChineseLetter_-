<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>月日 — 5 написаний</title>
  <link rel="stylesheet" href="hanzi-common.css">
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script src="hanzi-embed.js"></script>
</head>
<body>
  <main>
    <h1>Китайское слово</h1>
    <div class="hanzi" aria-hidden="true">月日</div>
    <p class="meta">yuèrì · месяцы и дни; время</p>
    <p class="hint">Напишите 月日 по чертам 5 раз: каждый иероглиф по очереди</p>
    <div class="rounds" id="rounds" aria-label="Прогресс: 5 написаний"></div>
    <div class="word-grid">
      <div class="writer-wrap"><div id="target-0" aria-label="Поле для написания иероглифа 月"></div></div>
      <div class="writer-wrap"><div id="target-1" aria-label="Поле для написания иероглифа 日"></div></div>
      <div id="prize" class="prize" aria-live="polite"><span>7215</span></div>
    </div>
    <p id="progress" class="progress">Написание 1 из 5 · иероглиф 1 из 2 · черта 0 из 0</p>
    <p id="status" class="status" role="status">Обведите контур, начиная с первой черты</p>
    <div class="actions">
      <button type="button" id="animate-btn">Показать черты</button>
      <button type="button" class="primary" id="retry-btn">Заново</button>
    </div>
  </main>
  <script>window.HANZI = {"chars": ["月", "日"], "pinyin": "yuèrì", "meaning": "месяцы и дни; время", "prize": "7215"};</script>
  <script src="hanzi-word-exc.js"></script>

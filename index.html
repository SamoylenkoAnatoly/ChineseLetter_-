<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>口 — ввод по чертам</title>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <style>
    :root {
      --ink: #1c1917;
      --muted: #57534e;
      --paper: #faf6ef;
      --card: #fffdf8;
      --line: #e7e0d4;
      --grid: #eadfce;
      --accent: #b42318;
      --ok: #166534;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 32px 28px 28px;
      box-shadow: 0 12px 40px rgba(28, 25, 23, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hanzi {
      font-size: 72px;
      line-height: 1;
      margin: 8px 0 4px;
    }

    .meta {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 16px;
    }

    .hint {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .writer-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 16px;
    }

    #character-target {
      width: 280px;
      height: 280px;
      background: #fff;
      border: 2px solid #c4b8a8;
      border-radius: 8px;
      touch-action: none;
      cursor: crosshair;
    }

    .progress {
      margin: 0 0 10px;
      font-size: 15px;
      color: var(--muted);
    }

    .status {
      min-height: 24px;
      margin: 0 0 16px;
      font-size: 16px;
    }

    .status.ok { color: var(--ok); font-weight: 600; }
    .status.miss { color: var(--accent); }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      font: inherit;
      font-size: 14px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
    }

    button:hover { background: #f5efe6; }

    button.primary {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    button.primary:hover { background: #44403c; }
  </style>
</head>
<body>
  <main>
    <h1>Китайский иероглиф</h1>
    <div class="hanzi" aria-hidden="true">口</div>
    <p class="meta">kǒu · рот</p>
    <p class="hint">Нарисуйте 口 по чертам в правильном порядке</p>

    <div class="writer-wrap">
      <svg
        id="character-target"
        xmlns="http://www.w3.org/2000/svg"
        width="280"
        height="280"
        viewBox="0 0 280 280"
        aria-label="Поле для написания иероглифа 口"
      >
        <line x1="0" y1="0" x2="280" y2="280" stroke="#eadfce" />
        <line x1="280" y1="0" x2="0" y2="280" stroke="#eadfce" />
        <line x1="140" y1="0" x2="140" y2="280" stroke="#eadfce" />
        <line x1="0" y1="140" x2="280" y2="140" stroke="#eadfce" />
      </svg>
    </div>

    <p id="progress" class="progress">Черта 0 из 3</p>
    <p id="status" class="status" role="status">Обведите контур, начиная с первой черты</p>

    <div class="actions">
      <button type="button" id="animate-btn">Показать черты</button>
      <button type="button" class="primary" id="retry-btn">Заново</button>
    </div>
  </main>

  <script>
    const SIZE = 280;
    const TOTAL = 3;
    const progressEl = document.getElementById("progress");
    const statusEl = document.getElementById("status");

    function setProgress(done) {
      progressEl.textContent = "Черта " + done + " из " + TOTAL;
    }

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    const writer = HanziWriter.create("character-target", "口", {
      width: SIZE,
      height: SIZE,
      padding: 24,
      showCharacter: false,
      showOutline: true,
      strokeColor: "#1c1917",
      outlineColor: "#d6cfc3",
      drawingColor: "#b42318",
      highlightColor: "#b42318",
      highlightCompleteColor: "#166534",
      drawingWidth: 6,
      showHintAfterMisses: 2,
      highlightOnComplete: true,
      onLoadCharDataError: function () {
        setStatus("Не удалось загрузить данные иероглифа", "miss");
      }
    });

    function startQuiz() {
      setProgress(0);
      setStatus("Обведите контур, начиная с первой черты");
      writer.quiz({
        onCorrectStroke: function (data) {
          const done = data.strokeNum + 1;
          setProgress(done);
          if (data.strokesRemaining > 0) {
            setStatus("Верно. Осталось черт: " + data.strokesRemaining);
          }
        },
        onMistake: function (data) {
          if (data.mistakesOnStroke >= 2) {
            setStatus("Не та черта — смотрите подсказку", "miss");
          } else {
            setStatus("Попробуйте ещё раз эту черту", "miss");
          }
        },
        onComplete: function () {
          setProgress(TOTAL);
          setStatus("Верно: 口", "ok");
        }
      });
    }

    function replay() {
      writer.cancelQuiz();
      writer.hideCharacter({ duration: 0 });
      startQuiz();
    }

    document.getElementById("retry-btn").addEventListener("click", replay);
    document.getElementById("animate-btn").addEventListener("click", function () {
      writer.cancelQuiz();
      writer.hideCharacter({ duration: 0 });
      setStatus("Смотрите порядок черт");
      writer.animateCharacter({
        onComplete: function () {
          writer.hideCharacter({ duration: 200 });
          startQuiz();
        }
      });
    });

    startQuiz();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>口 — ввод по чертам</title>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <script src="hanzi-embed.js"></script>
  <style>
    :root {
      --ink: #1c1917;
      --muted: #57534e;
      --paper: #faf6ef;
      --card: #fffdf8;
      --line: #e7e0d4;
      --grid: #eadfce;
      --accent: #b42318;
      --ok: #166534;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }

    html { touch-action: manipulation; }

    body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      font-family: "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      background: var(--paper);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    main {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px 20px 20px;
      box-shadow: 0 12px 40px rgba(28, 25, 23, 0.08);
      text-align: center;
    }

    .in-iframe body { padding: 8px; }
    .in-iframe main {
      box-shadow: none;
      padding: 16px 14px 14px;
    }
    .in-iframe .hanzi { font-size: 44px; }

    h1 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hanzi {
      font-size: 64px;
      line-height: 1;
      margin: 8px 0 4px;
    }

    .meta {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 16px;
    }

    .hint {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .writer-wrap {
      width: 280px;
      height: 280px;
      margin: 0 auto 16px;
      position: relative;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .writer-wrap::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-color: #fff;
      background-image:
        linear-gradient(#eadfce, #eadfce),
        linear-gradient(#eadfce, #eadfce),
        linear-gradient(45deg, transparent calc(50% - 0.5px), #eadfce 0, #eadfce calc(50% + 0.5px), transparent 0),
        linear-gradient(-45deg, transparent calc(50% - 0.5px), #eadfce 0, #eadfce calc(50% + 0.5px), transparent 0);
      background-size: 100% 1px, 1px 100%, 100% 100%, 100% 100%;
      background-position: center, center, center, center;
      background-repeat: no-repeat;
      border: 2px solid #c4b8a8;
      border-radius: 8px;
    }

    #character-target {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    #character-target canvas {
      display: block;
      touch-action: none;
    }

    .progress {
      margin: 0 0 10px;
      font-size: 15px;
      color: var(--muted);
    }

    .status {
      min-height: 24px;
      margin: 0 0 16px;
      font-size: 16px;
    }

    .status.ok { color: var(--ok); font-weight: 600; }
    .status.miss { color: var(--accent); }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      font: inherit;
      font-size: 14px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      cursor: pointer;
    }

    button:hover { background: #f5efe6; }

    button.primary {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    button.primary:hover { background: #44403c; }
  </style>
</head>
<body>
  <main>
    <h1>Китайский иероглиф</h1>
    <div class="hanzi" aria-hidden="true">口</div>
    <p class="meta">kǒu · рот</p>
    <p class="hint">Нарисуйте 口 по чертам в правильном порядке</p>

    <div class="writer-wrap">
      <div id="character-target" aria-label="Поле для написания иероглифа 口"></div>
    </div>

    <p id="progress" class="progress">Черта 0 из 3</p>
    <p id="status" class="status" role="status">Обведите контур, начиная с первой черты</p>

    <div class="actions">
      <button type="button" id="animate-btn">Показать черты</button>
      <button type="button" class="primary" id="retry-btn">Заново</button>
    </div>
  </main>

  <script>
    const TOTAL = 3;
    const targetEl = document.getElementById("character-target");
    const progressEl = document.getElementById("progress");
    const statusEl = document.getElementById("status");

    function setProgress(done) {
      progressEl.textContent = "Черта " + done + " из " + TOTAL;
    }

    function setStatus(text, kind) {
      statusEl.textContent = text;
      statusEl.className = "status" + (kind ? " " + kind : "");
    }

    const writer = HanziWriter.create(targetEl, "口", {
      width: 280,
      height: 280,
      padding: 24,
      renderer: "canvas",
      showCharacter: false,
      showOutline: true,
      strokeColor: "#1c1917",
      outlineColor: "#d6cfc3",
      drawingColor: "#b42318",
      highlightColor: "#b42318",
      highlightCompleteColor: "#166534",
      drawingWidth: 8,
      leniency: 1.6,
      showHintAfterMisses: 2,
      highlightOnComplete: true,
      onLoadCharDataError: function () {
        setStatus("Не удалось загрузить данные иероглифа", "miss");
      }
    });

    HanziEmbed.setup(writer, targetEl);

    function startQuiz() {
      setProgress(0);
      setStatus("Обведите контур, начиная с первой черты");
      writer.quiz({
        onCorrectStroke: function (data) {
          const done = data.strokeNum + 1;
          setProgress(done);
          if (data.strokesRemaining > 0) {
            setStatus("Верно. Осталось черт: " + data.strokesRemaining);
          }
        },
        onMistake: function (data) {
          if (data.mistakesOnStroke >= 2) {
            setStatus("Не та черта — смотрите подсказку", "miss");
          } else {
            setStatus("Попробуйте ещё раз эту черту", "miss");
          }
        },
        onComplete: function () {
          setProgress(TOTAL);
          setStatus("Верно: 口", "ok");
        }
      });
    }

    function replay() {
      writer.cancelQuiz();
      writer.hideCharacter({ duration: 0 });
      startQuiz();
    }

    document.getElementById("retry-btn").addEventListener("click", replay);
    document.getElementById("animate-btn").addEventListener("click", function () {
      writer.cancelQuiz();
      writer.hideCharacter({ duration: 0 });
      setStatus("Смотрите порядок черт");
      writer.animateCharacter({
        onComplete: function () {
          writer.hideCharacter({ duration: 200 });
          startQuiz();
        }
      });
    });

    startQuiz();
  </script>
</body>
</html>
